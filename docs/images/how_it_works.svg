<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8820c"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- left: built-in -->
  <text x="20" y="30" font-weight="bold" font-size="16" fill="#222">Blender's Cryptomatte</text>
  <text x="20" y="50" fill="#666">IDs come from the first surface the camera ray hits</text>
  <rect x="25" y="110" width="40" height="30" rx="4" fill="#444"/><text x="20" y="160" fill="#444">camera</text>
  <circle cx="230" cy="125" r="55" fill="#cfe8f7" stroke="#6aa6c9" stroke-width="2"/><text x="207" y="200" fill="#4a86a9">glass</text>
  <rect x="360" y="100" width="50" height="50" fill="#d33"/><text x="362" y="170" fill="#a22">cube</text>
  <line x1="65" y1="125" x2="172" y2="125" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="175" cy="125" r="6" fill="#4a86a9"/>
  <text x="20" y="235" fill="#222">Pixel ID = <tspan font-weight="bold">glass</tspan>. The cube behind it has no matte.</text>

  <!-- right: CryptoRay -->
  <text x="470" y="30" font-weight="bold" font-size="16" fill="#222">CryptoRay</text>
  <text x="470" y="50" fill="#666">Each object glows in its own light group; light refracts</text>
  <rect x="475" y="110" width="40" height="30" rx="4" fill="#444"/><text x="470" y="160" fill="#444">camera</text>
  <circle cx="680" cy="125" r="55" fill="#cfe8f7" stroke="#6aa6c9" stroke-width="2"/><text x="657" y="200" fill="#4a86a9">glass</text>
  <rect x="810" y="100" width="50" height="50" fill="#fff" stroke="#e8820c" stroke-width="3"/><text x="796" y="170" fill="#e8820c">emits white</text>
  <path d="M808,118 L735,112 Q680,105 625,118 L517,124" fill="none" stroke="#e8820c" stroke-width="2.5" marker-end="url(#o)"/>
  <path d="M808,134 L735,140 Q680,148 625,134 L517,128" fill="none" stroke="#e8820c" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="470" y="235" fill="#222">Light group pass "cube" = the cube's matte, bent by the glass.</text>

  <!-- pipeline -->
  <line x1="20" y1="262" x2="880" y2="262" stroke="#ddd"/>
  <text x="20" y="290" font-weight="bold" font-size="16" fill="#222">Pipeline (one Ctrl+F12)</text>
  <g font-size="13">
    <rect x="20" y="310" width="150" height="92" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="32" y="333" font-weight="bold" fill="#222">Build</text>
    <text x="32" y="353" fill="#444">ID_MATTES view layer</text>
    <text x="32" y="371" fill="#444">+ proxy per object</text>
    <text x="32" y="389" fill="#444">(originals untouched)</text>

    <rect x="195" y="310" width="150" height="92" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="207" y="333" font-weight="bold" fill="#222">Render</text>
    <text x="207" y="353" fill="#444">Beauty layer as usual</text>
    <text x="207" y="371" fill="#444">ID layer: one light-</text>
    <text x="207" y="389" fill="#444">group pass per ID</text>

    <rect x="370" y="310" width="150" height="92" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="382" y="333" font-weight="bold" fill="#222">Normalize</text>
    <text x="382" y="353" fill="#444">coverage = pass /</text>
    <text x="382" y="371" fill="#444">sum of all passes</text>
    <text x="382" y="389" fill="#444">(cancels glass tint)</text>

    <rect x="545" y="310" width="150" height="92" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="557" y="333" font-weight="bold" fill="#222">Encode</text>
    <text x="557" y="353" fill="#444">top 6 IDs per pixel</text>
    <text x="557" y="371" fill="#444">MurmurHash3 IDs</text>
    <text x="557" y="389" fill="#444">→ Cryptomatte layers</text>

    <rect x="720" y="310" width="160" height="92" rx="8" fill="#fff4e6" stroke="#e8820c"/>
    <text x="732" y="333" font-weight="bold" fill="#222">Beauty EXR</text>
    <text x="732" y="353" fill="#444">CryptoRayObject</text>
    <text x="732" y="371" fill="#444">CryptoRayMaterial</text>
    <text x="732" y="389" fill="#444">→ Nuke Cryptomatte</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)">
    <line x1="171" y1="356" x2="192" y2="356"/><line x1="346" y1="356" x2="367" y2="356"/>
    <line x1="521" y1="356" x2="542" y2="356"/><line x1="696" y1="356" x2="717" y2="356"/>
  </g>
  <text x="20" y="440" fill="#666" font-size="13">Reflection rays don't see the ID layer (Ignore Glass Reflections), so mattes through glass stay solid.</text>
  <text x="20" y="458" fill="#666" font-size="13">The world is an ID too ("Background"), so every pixel's coverage adds up to 1.</text>
</svg>
