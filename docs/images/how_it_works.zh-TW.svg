<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="PingFang TC, Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8820c"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- left: built-in -->
  <text x="20" y="30" font-weight="bold" font-size="16" fill="#222">Blender 內建的 Cryptomatte</text>
  <text x="20" y="50" fill="#666">ID 只來自攝影機光線擊中的第一個表面</text>
  <rect x="25" y="110" width="40" height="30" rx="4" fill="#444"/><text x="20" y="160" fill="#444">攝影機</text>
  <circle cx="230" cy="125" r="55" fill="#cfe8f7" stroke="#6aa6c9" stroke-width="2"/><text x="207" y="200" fill="#4a86a9">玻璃</text>
  <rect x="360" y="100" width="50" height="50" fill="#d33"/><text x="362" y="170" fill="#a22">立方體</text>
  <line x1="65" y1="125" x2="172" y2="125" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="175" cy="125" r="6" fill="#4a86a9"/>
  <text x="20" y="235" fill="#222">像素 ID = <tspan font-weight="bold">玻璃</tspan>，後面的立方體沒有遮罩。</text>

  <!-- right: CryptoRay -->
  <text x="470" y="30" font-weight="bold" font-size="16" fill="#222">CryptoRay</text>
  <text x="470" y="50" fill="#666">每個物件在自己的燈光群組中發光；光會折射</text>
  <rect x="475" y="110" width="40" height="30" rx="4" fill="#444"/><text x="470" y="160" fill="#444">攝影機</text>
  <circle cx="680" cy="125" r="55" fill="#cfe8f7" stroke="#6aa6c9" stroke-width="2"/><text x="657" y="200" fill="#4a86a9">玻璃</text>
  <rect x="810" y="100" width="50" height="50" fill="#fff" stroke="#e8820c" stroke-width="3"/><text x="796" y="170" fill="#e8820c">發白光</text>
  <path d="M808,118 L735,112 Q680,105 625,118 L517,124" fill="none" stroke="#e8820c" stroke-width="2.5" marker-end="url(#o)"/>
  <path d="M808,134 L735,140 Q680,148 625,134 L517,128" fill="none" stroke="#e8820c" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="470" y="235" fill="#222">燈光群組通道「立方體」 = 立方體的遮罩，已被玻璃折射彎曲。</text>

  <!-- pipeline -->
  <line x1="20" y1="262" x2="880" y2="262" stroke="#ddd"/>
  <text x="20" y="290" font-weight="bold" font-size="16" fill="#222">流程（一次 Ctrl+F12）</text>
  <g font-size="13">
    <rect x="20" y="310" width="150" height="92" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="32" y="333" font-weight="bold" fill="#222">建立</text>
    <text x="32" y="353" fill="#444">ID_MATTES 視圖層</text>
    <text x="32" y="371" fill="#444">+ 每個物件一個代理</text>
    <text x="32" y="389" fill="#444">（不修改原物件）</text>

    <rect x="195" y="310" width="150" height="92" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="207" y="333" font-weight="bold" fill="#222">渲染</text>
    <text x="207" y="353" fill="#444">Beauty 圖層照常渲染</text>
    <text x="207" y="371" fill="#444">ID 圖層：每個 ID</text>
    <text x="207" y="389" fill="#444">一個燈光群組通道</text>

    <rect x="370" y="310" width="150" height="92" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="382" y="333" font-weight="bold" fill="#222">正規化</text>
    <text x="382" y="353" fill="#444">覆蓋率 = 通道 /</text>
    <text x="382" y="371" fill="#444">所有通道之和</text>
    <text x="382" y="389" fill="#444">（抵消玻璃染色）</text>

    <rect x="545" y="310" width="150" height="92" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="557" y="333" font-weight="bold" fill="#222">編碼</text>
    <text x="557" y="353" fill="#444">每像素前 6 個 ID</text>
    <text x="557" y="371" fill="#444">MurmurHash3 ID</text>
    <text x="557" y="389" fill="#444">→ Cryptomatte 圖層</text>

    <rect x="720" y="310" width="160" height="92" rx="8" fill="#fff4e6" stroke="#e8820c"/>
    <text x="732" y="333" font-weight="bold" fill="#222">Beauty EXR</text>
    <text x="732" y="353" fill="#444">CryptoRayObject</text>
    <text x="732" y="371" fill="#444">CryptoRayMaterial</text>
    <text x="732" y="389" fill="#444">→ Nuke Cryptomatte</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)">
    <line x1="171" y1="356" x2="192" y2="356"/><line x1="346" y1="356" x2="367" y2="356"/>
    <line x1="521" y1="356" x2="542" y2="356"/><line x1="696" y1="356" x2="717" y2="356"/>
  </g>
  <text x="20" y="440" fill="#666" font-size="13">反射光線看不到 ID 圖層（忽略玻璃反射），因此透過玻璃的遮罩保持完整。</text>
  <text x="20" y="458" fill="#666" font-size="13">世界環境也是一個 ID（「Background」），因此每個像素的覆蓋率總和為 1。</text>
</svg>
